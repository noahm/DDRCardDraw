name: Checks

on:
  # Unfiltered, so PRs into long-lived branches like partykit are checked too.
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - check: "validate:json"
            name: Validate Song Data
          - check: "validate:ts"
            name: Typecheck
          - check: "validate:format"
            name: Formatting
          - check: "validate:lint"
            name: Linter
          - check: webpack
            name: Build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: yarn
      - name: Install Dependencies
        run: yarn --immutable
      - name: ${{ matrix.name }}
        run: yarn ${{ matrix.check }}
